<!-- Google Pay Section -->
<div class="ff-payment-method-card ff-payment-method-google-pay">
  <label class="ff-payment-method-label ff-google-pay-header">
    <input
      type="radio"
      name="payment-method"
      value="GOOGLE_PAY"
      class="ff-payment-method-radio"
      checked
    />
    <div class="ff-payment-method-header">
      <div class="ff-payment-logo ff-google-pay-logo">
        <img
          src="https://developers.google.com/static/pay/api/images/brand-guidelines/google-pay-mark.png"
          alt="Google Pay"
        />
      </div>
    </div>
  </label>
  <div class="ff-payment-method-content">
    <ul class="ff-payment-features">
      <li class="ff-payment-feature">
        <svg width="13" height="11" viewBox="0 0 13 11" fill="none">
          <path
            stroke="#F8545D"
            d="M11.1997 1.80133L6.99269 8.63774C6.68226 9.14218 5.9932 9.24721 5.54659 8.85815L2.19971 5.94254"
            stroke-width="2.66667"
            stroke-linecap="round"
          ></path>
        </svg>
        <span>Easy and private payments with Face/Touch ID</span>
      </li>
      <li class="ff-payment-feature">
        <svg width="13" height="11" viewBox="0 0 13 11" fill="none">
          <path
            stroke="#F8545D"
            d="M11.1997 1.80133L6.99269 8.63774C6.68226 9.14218 5.9932 9.24721 5.54659 8.85815L2.19971 5.94254"
            stroke-width="2.66667"
            stroke-linecap="round"
          ></path>
        </svg>
        <span>Keeps your financial info safe with end-to-end encryption</span>
      </li>
      <li class="ff-payment-feature">
        <svg width="13" height="11" viewBox="0 0 13 11" fill="none">
          <path
            stroke="#F8545D"
            d="M11.1997 1.80133L6.99269 8.63774C6.68226 9.14218 5.9932 9.24721 5.54659 8.85815L2.19971 5.94254"
            stroke-width="2.66667"
            stroke-linecap="round"
          ></path>
        </svg>
        <span>Protected by Google Pay's unique Device Account Number</span>
      </li>
    </ul>
    <div
      class="ff-google-pay-button-container ff-payment-container"
      id="googlePayButton"
    ></div>
    <div class="loader-container payment-button-loader">
      <div class="loader"></div>
    </div>
    <div class="payment-errors-container"></div>
    <p class="ff-security-message">
      Your payment information is secure with SSL/TLS encryption
    </p>
  </div>
</div>
